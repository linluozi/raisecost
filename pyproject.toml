[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raisecost"
version = "0.1.0"
description = "Per-site exception cost profiler for CPython 3.12+ (sys.monitoring)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["profiler", "exceptions", "sys.monitoring", "performance"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
raisecost = "raisecost.cli:main"

[tool.setuptools]
packages = ["raisecost"]
